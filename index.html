<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6554cf"><title>Skye's Math Detective</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#27233b;background:#f4f1ff}*{box-sizing:border-box}body{margin:0;padding:20px}.app{max-width:570px;margin:20px auto;background:white;border-radius:24px;padding:25px;box-shadow:0 12px 35px #35276a18}h1{margin:0;font-size:1.65rem}small,.muted{color:#726d83}.top,.stats,.actions,.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.stats{margin:22px 0}.stat{background:#f4f1ff;padding:14px 5px;text-align:center;flex:1;border-radius:13px}.stat strong{display:block;font-size:1.5rem}.stat span{font-size:.8rem}.bar{height:9px;background:#ebe8f7;border-radius:10px;overflow:hidden}.fill{height:100%;background:#55b987;width:0;transition:width .2s}.problem{text-align:center;background:#f4f1ff;border-radius:18px;padding:36px 12px;margin:20px 0;font-size:clamp(1.8rem,7vw,2.6rem);font-weight:750}label{display:block;font-weight:650;margin-bottom:9px}select{border:2px solid #d9d3ed;border-radius:10px;background:white;color:#27233b;font-size:1rem;padding:9px 12px;max-width:100%;width:150px}.settings{margin-top:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.settings label{margin:0}input{width:100%;padding:15px;font-size:1.3rem;border:2px solid #d9d3ed;border-radius:12px;text-align:center}button{border:0;border-radius:11px;padding:13px 16px;font-size:1rem;font-weight:650;cursor:pointer;background:#6554cf;color:white}button.secondary{background:#eeeafa;color:#473b93}button:disabled{opacity:.4;cursor:not-allowed}.wide{width:100%;margin-top:12px}.actions{margin-top:18px;flex-wrap:wrap}.message{min-height:28px;margin-top:15px;font-weight:600}.hint{background:#fff5d9;padding:12px;border-radius:12px;margin-top:12px}.hidden{display:none}.bottom{border-top:1px solid #eee;margin-top:22px;padding-top:17px;flex-wrap:wrap}#finish{text-align:center;padding:35px 0}#finish h2{font-size:2rem}@media(max-width:440px){.app{padding:17px}body{padding:8px}.top{align-items:flex-start}.top button{font-size:.8rem;padding:10px}.actions button{flex:1}}
</style></head><body><main class="app"><div class="top"><div><h1>🔎 Skye's Math Detective</h1><small id="round">Round 1 · Numbers up to 20</small></div><button class="secondary" id="resetTop">↻ Reset</button></div><div class="settings"><label for="maximum">Maximum Number</label><select id="maximum" aria-label="Maximum number"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="40">40</option><option value="50">50</option><option value="60">60</option><option value="70">70</option><option value="80">80</option><option value="90">90</option><option value="100">100</option></select></div><div class="stats"><div class="stat"><strong id="completed">0/20</strong><span>Solved</span></div><div class="stat"><strong id="correct">0</strong><span>Correct</span></div><div class="stat"><strong id="remaining">20</strong><span>Remaining</span></div></div><div class="bar"><div class="fill" id="progress"></div></div><section id="game"><p class="muted" id="questionNum">Question 1 of 20</p><div class="problem" id="problem"></div><form id="answerForm"><label for="answer">What's the missing number?</label><input id="answer" type="number" inputmode="numeric" min="0" max="20" required placeholder="Type your answer" autocomplete="off"><button class="wide" type="submit">✓ Check My Answer</button></form><div class="message" id="message" aria-live="polite"></div><div class="hint hidden" id="hint"></div><div class="actions"><button class="secondary" id="hintBtn" type="button">💡 Get a Hint</button><button class="secondary" id="prevBtn" type="button">← Back</button><button id="nextBtn" type="button" disabled>Next →</button></div></section><section id="finish" class="hidden"><h2>🏆 Mission Complete!</h2><p>Excellent work!</p><p>You solved all <strong>20</strong> mysteries!</p><button id="playAgain">↻ New 20 Questions</button></section><div class="bottom"><small>Ready for a fresh set?</small><button class="secondary" id="resetBottom">↻ New 20 Questions</button></div></main><script>
const $=id=>document.getElementById(id);
let questions=[],index=0,round=1,solved=new Set(),answers={},praise={},maximum=20;
const rand=(min,max)=>min+Math.floor(Math.random()*(max-min+1));
const cheers=['Correct! Great work!','Awesome job!','Excellent thinking!','You got it!','Fantastic!','Well done!','Brilliant!','Keep up the great work!','Perfect answer!','Amazing work!'];
let audioContext;
function playChime(){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    audioContext??=new AudioCtx();
    if(audioContext.state==='suspended')audioContext.resume();
    const now=audioContext.currentTime;
    [659.25,783.99,1046.5].forEach((freq,i)=>{
      const osc=audioContext.createOscillator(),gain=audioContext.createGain();
      const start=now+i*.105;
      osc.type='sine';osc.frequency.value=freq;
      gain.gain.setValueAtTime(0.0001,start);
      gain.gain.exponentialRampToValueAtTime(0.11,start+.018);
      gain.gain.exponentialRampToValueAtTime(0.0001,start+.38);
      osc.connect(gain);gain.connect(audioContext.destination);
      osc.start(start);osc.stop(start+.4);
    });
  }catch(err){console.warn('Audio unavailable:',err);}
}
function makeQuestion(type){
  let a,b,answer,display,hint;
  if(type===0){a=rand(2,maximum);b=rand(1,a);answer=b;display=`${a} − □ = ${a-b}`;hint=`What do you add to ${a-b} to get ${a}?`;}
  else if(type===1){a=rand(1,maximum-1);b=rand(1,maximum-a);answer=b;display=`${a} + □ = ${a+b}`;hint=`Count up from ${a} to ${a+b}.`;}
  else if(type===2){a=rand(1,maximum-1);b=rand(1,maximum-a);answer=a+b;display=`□ − ${a} = ${b}`;hint=`Add ${a} and ${b}.`;}
  else{a=rand(1,maximum-1);b=rand(1,maximum-a);answer=a;display=`□ + ${b} = ${a+b}`;hint=`Count backward ${b} steps from ${a+b}.`;}
  return {display,answer,hint};
}
function generate(){
  const result=[],seen=new Set();let tries=0;
  while(result.length<20&&tries++<10000){const q=makeQuestion(result.length%4);if(!seen.has(q.display)){seen.add(q.display);result.push(q);}}
  for(let i=result.length-1;i>0;i--){const j=rand(0,i);[result[i],result[j]]=[result[j],result[i]];}
  return result;
}
function render(){
  const q=questions[index];
  $('round').textContent=`Round ${round} · Numbers up to ${maximum}`;
  $('completed').textContent=`${solved.size}/20`;
  $('correct').textContent=solved.size;
  $('remaining').textContent=20-solved.size;
  $('progress').style.width=`${solved.size*5}%`;
  $('questionNum').textContent=`Question ${index+1} of 20`;
  $('problem').textContent=q.display;
  $('answer').max=maximum;
  $('answer').value=answers[index]??'';
  $('answer').disabled=solved.has(index);
  $('nextBtn').disabled=!solved.has(index);
  $('nextBtn').textContent=index===19?'Finish ✓':'Next →';
  $('prevBtn').disabled=index===0;
  $('hint').classList.add('hidden');
  $('hint').textContent=q.hint;
  $('hintBtn').textContent='💡 Get a Hint';
  $('message').textContent=solved.has(index)?`✅ ${praise[index]}`:'';
  $('game').classList.remove('hidden');
  $('finish').classList.add('hidden');
}
function reset(){round++;questions=generate();index=0;solved=new Set();answers={};praise={};render();}
$('maximum').addEventListener('change',()=>{maximum=Number($('maximum').value);reset();});
$('answerForm').addEventListener('submit',e=>{
  e.preventDefault();const raw=$('answer').value.trim();if(!raw||solved.has(index))return;
  const guess=Number(raw);answers[index]=raw;
  if(guess===questions[index].answer){
    solved.add(index);praise[index]=cheers[rand(0,cheers.length-1)];
    playChime();render();
  }else{$('message').textContent='🔍 Not quite! Try thinking backward and try again.';$('answer').focus();}
});
$('hintBtn').onclick=()=>{const hidden=$('hint').classList.toggle('hidden');$('hintBtn').textContent=hidden?'💡 Get a Hint':'Hide Hint';};
$('prevBtn').onclick=()=>{if(index>0){index--;render();}};
$('nextBtn').onclick=()=>{if(!solved.has(index))return;if(index<19){index++;render();}else{$('game').classList.add('hidden');$('finish').classList.remove('hidden');}};
['resetTop','resetBottom','playAgain'].forEach(id=>$(id).onclick=reset);
questions=generate();render();
</script></body></html>
